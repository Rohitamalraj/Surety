[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun" # Uniswap v4 uses transient storage
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# Reproducible randomized ledger checks. Run with FOUNDRY_PROFILE=deep.
[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true

[profile.deep.invariant]
runs = 256
depth = 128
fail_on_revert = true
